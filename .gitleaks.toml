# Secret-scanning policy for the agent-delegation interoperability vectors.
#
# `publish/export.sh` runs `gitleaks detect --source <tree> --no-git` as the deep half of
# its leak gate, and gitleaks auto-discovers this file at the root of the scanned tree, so
# the export gate and this repository's own scans share one policy.
#
# This file only ever ADDS an exemption. It must never disable or weaken a rule.

[extend]
useDefault = true

# -- vectors.json ----------------------------------------------------------------------
# The whole point of this repository. Written by
# the reference implementation's `gen_conformance_vectors` example, holding only PUBLIC
# cryptographic artifacts: did:key identifiers
# (which encode public keys - did:key cannot represent a private key at all), CBOR
# credentials / presentations / tokens, Ed25519 signatures, payload hashes and status
# lists. No private key, seed or bearer credential appears in it.
#
# gitleaks' `generic-api-key` rule matches values here on Shannon entropy alone, including
# after hex-decoding the blobs one and two levels deep, purely because they are long
# high-entropy strings. Exempting the path rather than pinning finding fingerprints keeps
# the gate stable across regeneration, which is the only way this file ever changes.
#
# TRADE-OFF, accepted deliberately: this one path is not secret-scanned. The risk is
# bounded because nothing hand-edits it - its contents are fully determined by the
# generator above. Never add a path here that a human writes by hand.
[[allowlists]]
description = "vectors.json - generator-produced public cryptographic test artifacts"
targets = ["path"]
paths = ['''vectors\.json''']
