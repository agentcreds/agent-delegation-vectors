name: CI

on:
  push:
    branches: [main]
    tags: ["draft-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The vectors are data, so the first job checks the data itself: that it parses, that
  # every case carries the fields SPEC.md says its kind requires, that names are unique,
  # and that the multi-hop rejection case still has its control. A malformed file would
  # otherwise fail inside every consumer's adapter, where it looks like their bug.
  #
  # This is the gate that always applies, because it depends on nothing external.
  validate:
    name: validate vectors.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Structural validation
        run: python .github/validate_vectors.py
      # The release manifest names the exact bytes of every vector file. Two checks, one
      # in Python and one with nothing but coreutils, so a reader can reproduce the
      # second on any machine and trust that RELEASE.json means what it says.
      - name: Release manifest matches the files (RELEASE.json, SHA256SUMS)
        run: |
          python release.py --check
          sha256sum -c SHA256SUMS
      # A tag is a release name, and a release name means one set of bytes forever. The
      # tag must therefore be cut from a commit whose RELEASE.json says the same name;
      # anything else is a tag pointing at bytes it does not describe.
      - name: Tag names the manifest's release
        if: startsWith(github.ref, 'refs/tags/draft-')
        run: python release.py --tag-matches "${GITHUB_REF_NAME}"

  # Then the reference run: the published SDK through the published adapter. This is the
  # claim the repository makes about itself - if the reference implementation cannot pass
  # its own vectors, nobody else's failure means anything.
  #
  # The SDK is not on PyPI yet. Rather than fail CI permanently, or - worse - quietly pass
  # while running nothing, this job reports LOUDLY that the reference run did not execute.
  # A skipped check that reads as a tick is how a suite comes to certify nothing.
  reference:
    name: reference implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Is the reference implementation installable?
        id: probe
        run: |
          if pip download --no-deps --dest /tmp/probe agentcreds >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reference run NOT EXECUTED (SDK not yet published)
        if: steps.probe.outputs.available != 'true'
        run: |
          {
            echo "### WARNING Reference run did not execute"
            echo
            echo "\`agentcreds\` is not installable from PyPI, so the vectors were **not**"
            echo "run against the reference implementation in this job. Only the"
            echo "structural validation of \`vectors.json\` ran."
            echo
            echo "This is expected until the SDK is published. It is reported rather than"
            echo "silently skipped so that a green tick here is never mistaken for"
            echo "\"the reference implementation passes\"."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Reference run skipped::agentcreds is not on PyPI; vectors were not run against the reference implementation."

      # The vectors are the standard; the reference implementation is one consumer of
      # them, released on its own schedule. A release of the vectors can therefore be
      # ahead of the package on PyPI, and that is a fact about the package, not a defect
      # in the vectors - so this step reports, prominently, and does not fail the
      # workflow. The validate job above is what says whether THIS repository is sound.
      - name: Run the vectors against the reference implementation
        if: steps.probe.outputs.available == 'true'
        id: run
        continue-on-error: true
        run: |
          pip install agentcreds
          echo "version=$(pip show agentcreds | sed -n 's/^Version: //p')" >> "$GITHUB_OUTPUT"
          python runner/run_vectors.py --adapter runner/adapters/agentcreds_adapter.py | tee run.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Report the reference result
        if: steps.probe.outputs.available == 'true'
        run: |
          rel="$(python -c 'import json;print(json.load(open("RELEASE.json"))["release"])')"
          ver="${{ steps.run.outputs.version }}"
          res="$(grep -E '^(DELEGATION|CANONICALIZATION):' run.log | paste -sd ' ')"
          if [ "${{ steps.run.outcome }}" = "success" ]; then
            echo "### Reference implementation agentcreds $ver passes $rel" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Reference run::agentcreds $ver on $rel - $res"
          else
            echo "### WARNING agentcreds $ver does NOT pass $rel" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Reference implementation behind the vectors::agentcreds $ver on $rel - $res The vectors are released independently of the package; a package release that passes is the follow-up."
          fi
          fence='```'
          { echo; echo "$fence"; grep -E '^(  FAIL|DELEGATION|CANONICALIZATION|  failed)' run.log; echo "$fence"; } >> "$GITHUB_STEP_SUMMARY"
